<section class="cta" aria-labelledby="cta-titulo">
  <picture class="cta__foto">
    <source type="image/avif" srcset="/assets/img/cta-rio-980.avif 980w, /assets/img/cta-rio-1400.avif 1400w, /assets/img/cta-rio-1920.avif 1920w" sizes="100vw">
    <source type="image/webp" srcset="/assets/img/cta-rio-980.webp 980w, /assets/img/cta-rio-1400.webp 1400w, /assets/img/cta-rio-1920.webp 1920w" sizes="100vw">
    <img src="/assets/img/cta-rio-1400.webp" alt="" width="1920" height="720" loading="lazy" decoding="async">
  </picture>

  <div class="cta__veu" aria-hidden="true"></div>

  <div class="cta__inner container">
    <h2 class="display cta__titulo" id="cta-titulo">
      Vamos construir<br>
      um Brasil com mais<br>
      <span class="amarelo">oportunidades?</span>
    </h2>

    <div class="cta__meio">
      <p>
        Faça parte dessa rede que acredita no poder do esporte, da cultura e do lazer para
        transformar vidas.
      </p>
      <a class="btn btn--amarelo" href="{{whatsappLink}}" target="_blank" rel="noopener">
        Fale conosco
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
      </a>
    </div>

    <p class="cta__lettering" aria-hidden="true">
      <span class="script">Juntos<br>por um Brasil<br>mais inclusivo.</span>
      <svg class="rabisco" viewBox="0 0 170 26" fill="none" aria-hidden="true">
        <path d="M3 21C34 9.5 96 1.5 166 4.5" stroke="#fcc514" stroke-width="5" stroke-linecap="round"/>
        <path d="M3 24.5C34 14 96 6 166 9" stroke="#018340" stroke-width="5" stroke-linecap="round"/>
      </svg>
    </p>
  </div>
</section>
