<section class="hero" id="inicio">

  <picture class="hero__foto">

    <source media="(max-width: 900px)" type="image/webp" srcset="/assets/img/hero-mobile-540.webp 540w, /assets/img/hero-mobile-640.webp 640w, /assets/img/hero-mobile-760.webp 760w, /assets/img/hero-mobile-900.webp 900w" sizes="100vw">
    <source type="image/avif" srcset="/assets/img/hero-desktop-960.avif 960w, /assets/img/hero-desktop-1280.avif 1280w, /assets/img/hero-desktop-1672.avif 1672w" sizes="58vw">

  <div class="hero__veu" aria-hidden="true"></div>

  <div class="hero__inner container">
    <div class="hero__texto">
      <p class="hero__kicker">Esporte, cultura, lazer <span>e inclusão social.</span></p>

      <h1 class="hero__titulo display">
        Levar oportunidade<br>

        <span class="amarelo">mais faz falta.</span>
      </h1>

      <p class="hero__sub">
        A Confederação Brasileira de Desportos e Lazer leva esporte, cultura e lazer às

      </p>

      <a class="btn btn--amarelo" href="#sobre">
        Conheça a CBD
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"/></svg>

    </div>

    <p class="hero__lettering" aria-hidden="true">
      <span class="script">Mais<br>Esporte<br>Mais<br>Futuros</span>
      <svg class="rabisco" viewBox="0 0 170 26" fill="none" aria-hidden="true">
        <path d="M3 21C34 9.5 96 1.5 166 4.5" stroke="#fcc514" stroke-width="5" stroke-linecap="round"/>
        <path d="M3 24.5C34 14 96 6 166 9" stroke="#018340" stroke-width="5" stroke-linecap="round"/>
      </svg>
